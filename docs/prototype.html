<style>
/* Layout: one centered column (max 760px) for search and reading, wider (1040px) for admin; sticky translucent top bar. Single light look by the user's choice. */
:root {
  color-scheme: light;
  --bg: #f2f2f5;
  --page: #fbfbfd;
  --surface: #ffffff;
  --fg: #1d1d1f;
  --muted: #5f6368;
  --line: #d9d9de;
  --accent: #0066cc;
  --accent-soft: #e8f1fb;
  --mark: #fff3bf;
  --ok: #1a7f37;
  --wait: #8a5a00;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, Arial, sans-serif;
  --r: 18px;
}
html, body { height: 100%; }
body { background: var(--page); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
button, input { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.02em; line-height: 1.15; }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 760px; margin-inline: auto; }
.col.wide { max-width: 1040px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(251,251,253,.86); backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1040px; margin-inline: auto; display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-weight: 700; font-size: 20px; letter-spacing: -0.03em; background: none; border: 0; padding: 6px 2px; cursor: pointer; }
.org { color: var(--muted); font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav button { background: none; border: 0; padding: 8px 12px; min-height: 36px; border-radius: 999px; cursor: pointer; color: var(--muted); font-size: 15px; }
.nav button[aria-current="page"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.nav button:hover { color: var(--fg); }

.btn { background: var(--accent); color: #ffffff; border: 0; border-radius: 999px; padding: 11px 22px; min-height: 44px; font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--surface); color: var(--accent); box-shadow: inset 0 0 0 1px var(--line); }

/* login */
.login { min-height: 100%; display: grid; place-items: center; padding-block: 32px; }
.login-card { width: 100%; max-width: 400px; background: var(--surface); border-radius: 22px; padding: 32px 28px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 40px rgba(0,0,0,.06); display: flex; flex-direction: column; gap: 18px; }
.login-card h1 { font-size: 40px; }
.login-card p { color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
.field input { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 44px; font-size: 16px; color: var(--fg); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 9px 8px; min-height: 40px; cursor: pointer; color: var(--muted); font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.hint { font-size: 13px; color: var(--muted); }

/* search */
main { padding-block: 40px 72px; }
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 28px; padding-top: clamp(16px, 9vh, 96px); }
.wordmark { font-size: clamp(60px, 12vw, 96px); font-weight: 700; letter-spacing: -0.055em; line-height: 1; }
.wordmark i { font-style: normal; color: var(--accent); }
.hero > .lead { color: var(--muted); font-size: clamp(17px, 2.4vw, 21px); line-height: 1.35; max-width: 34ch; text-wrap: balance; }
.sgroup { width: 100%; min-width: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.results .sgroup { align-items: flex-start; }
.sbox { box-sizing: border-box; width: 100%; min-width: 0; display: flex; align-items: center; gap: 4px; background: var(--surface); border-radius: 999px; padding: 6px 6px 6px 22px; box-shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(0,0,0,.07); }
.sbox svg { flex: none; }
.sbox > svg { color: var(--muted); }
.sbox input { flex: 1; min-width: 0; border: 0; background: none; padding: 10px; font-size: 17px; min-height: 44px; }
.sbox input::-webkit-search-cancel-button { display: none; }
.sbox input:focus { outline: none; }
.sbox:focus-within { box-shadow: 0 0 0 2px var(--accent), 0 12px 32px rgba(0,102,204,.12); }
.go { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: #ffffff; cursor: pointer; display: grid; place-items: center; }
.go:hover { filter: brightness(1.08); }
.hero .sbox input { min-height: 56px; font-size: 19px; }
.hero .go { width: 56px; height: 56px; }
.modes { width: fit-content; max-width: 100%; }
.modes button { padding: 6px 18px; min-height: 34px; font-size: 14px; }
.try { width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: left; padding-top: 8px; }
.try-h { font-size: 13px; color: var(--muted); padding-left: 4px; }
.sug { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.chip { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; background: var(--bg); border: 0; border-radius: 16px; padding: 14px 18px; min-height: 54px; cursor: pointer; font-size: 15px; }
.chip::after { content: "→"; color: var(--muted); }
.chip:hover { background: var(--accent-soft); color: var(--accent); }
.chip:hover::after { color: var(--accent); }
.stat { font-size: 13px; color: var(--muted); }

.results { display: flex; flex-direction: column; gap: 20px; }
.count { color: var(--muted); font-size: 14px; }
.answer { background: var(--accent-soft); border-radius: var(--r); padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.answer p { font-size: 18px; line-height: 1.45; }
.src { font-size: 14px; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
.src:hover { text-decoration: underline; }
.list { background: var(--surface); border-radius: var(--r); box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.hit { display: flex; flex-direction: column; gap: 6px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 18px 22px; cursor: pointer; }
.hit:first-child { border-top: 0; }
.hit:hover { background: #fafafc; }
.hit h3 { font-size: 17px; font-weight: 600; color: var(--accent); letter-spacing: -0.01em; }
.meta { font-size: 13px; color: var(--muted); }
.quote { font-size: 15px; color: var(--fg); }
mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; }
.empty { background: var(--surface); border-radius: var(--r); box-shadow: 0 0 0 1px var(--line); padding: 28px 22px; display: flex; flex-direction: column; gap: 12px; }
.empty h2 { font-size: 20px; }
.empty p { color: var(--muted); }

/* document */
.back { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 8px 0; min-height: 36px; font-size: 15px; }
.doc { display: flex; flex-direction: column; gap: 22px; }
.doc h1 { font-size: clamp(26px, 4.5vw, 38px); }
.card { background: var(--surface); border-radius: var(--r); box-shadow: 0 0 0 1px var(--line); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { font-size: 18px; }
.clause { border-left: 3px solid var(--line); padding: 4px 0 4px 14px; display: flex; flex-direction: column; gap: 4px; }
.clause.on { border-left-color: var(--accent); }
.clause.on .quote { background: var(--mark); border-radius: 4px; padding: 2px 4px; }
.toc { columns: 2 260px; column-gap: 28px; font-size: 14px; color: var(--muted); padding: 0; list-style: none; }
.toc li { padding: 3px 0; break-inside: avoid; }

/* admin */
.admin { display: flex; flex-direction: column; gap: 22px; }
.admin-head { display: flex; gap: 12px 20px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.admin-head h1 { font-size: clamp(28px, 4.5vw, 38px); }
.usage { display: flex; flex-direction: column; gap: 8px; }
.meter { height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.drow { display: grid; grid-template-columns: minmax(0, 1fr) 90px 60px 120px; gap: 6px 16px; align-items: center; padding: 14px 22px; border-top: 1px solid var(--line); font-size: 15px; }
.drow:first-child { border-top: 0; }
.drow.head { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: #fafafc; }
.drow .t { min-width: 0; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px; width: fit-content; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: #e7f5ea; }
.pill.wait { color: var(--wait); background: #fff4d6; }
.note { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 16px 20px; color: var(--muted); font-size: 14px; }
.foot { color: var(--muted); font-size: 13px; padding-top: 28px; max-width: 70ch; }

@media (max-width: 640px) {
  main { padding-block: 24px 56px; }
  .hero { padding-top: 0; }
  .sug { grid-template-columns: 1fr; }
  .drow { grid-template-columns: minmax(0, 1fr) auto; }
  .drow.head { display: none; }
  .drow .t { grid-column: 1 / -1; }
  .drow .lang { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .hit { transition: filter .15s, background .15s, border-color .15s, color .15s; } }
</style>

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function words(q) { return q.toLowerCase().split(/[^a-zа-яёәғқңөұүһі0-9%]+/i).filter(function (w) { return w.length >= 3; }); }

function search(q, mode) {
  var ql = q.toLowerCase(), ws = words(q), out = [];
  CLAUSES.forEach(function (c) {
    var hay = (c.text + " " + c.sec + " " + DOCS[c.doc].title).toLowerCase(), score = 0, hits = [];
    ws.forEach(function (w) { if (hay.indexOf(w) > -1) { score += 2; hits.push(w); } });
    if (mode === "meaning") c.tags.forEach(function (t) { if (ql.indexOf(t) > -1) score += 3; });
    if (score > 0) out.push({ c: c, score: score, hits: hits });
  });
  return out.sort(function (a, b) { return b.score - a.score; });
}
function hl(text, hits) {
  var s = esc(text);

  if (S.role === "admin") nav += '<button data-go="admin"' + (S.view === "admin" ? ' aria-current="page"' : "") + ">Админка</button>";
  nav += '<button data-go="logout">Выйти</button>';
  return '<header class="bar"><div class="wrap"><div class="bar-in"><button class="brand" data-go="search" aria-label="Izde, на главную">Izde</button><span class="org">IITU</span><nav class="nav" aria-label="Разделы">' + nav + "</nav></div></div></header>";
}
function searchBox() {
  return '<div class="sgroup"><form class="sbox" id="sform" role="search"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="6"></circle><path d="M14 14l4 4"></path></svg>' +
    '<input id="q" type="search" autocomplete="off" placeholder="Спросите своими словами" aria-label="Поисковый запрос" value="' + esc(S.q) + '"><button class="go" type="submit" aria-label="Найти"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"></path></svg></button></form>' +
    '<div class="seg modes" role="group" aria-label="Режим поиска"><button type="button" data-mode="meaning" aria-pressed="' + (S.mode === "meaning") + '">По смыслу</button><button type="button" data-mode="keyword" aria-pressed="' + (S.mode === "keyword") + '">По словам</button></div></div>';
}
function chips() { return '<div class="sug">' + EXAMPLES.map(function (e) { return '<button class="chip" type="button" data-ex="' + esc(e) + '">' + esc(e) + "</button>"; }).join("") + "</div>"; }
var FOOT = '<p class="foot">Это прототип. Поиск и ответы имитируются в браузере, но названия документов и цитаты взяты из открытых PDF на iitu.edu.kz.</p>';

function vLogin() {
  return '<div class="wrap login"><form class="login-card" id="login"><div><h1>Izde</h1><p>Поиск по документам университета</p></div>' +
    '<label class="field" for="email">Почта<input id="email" type="email" value="student@iitu.edu.kz" autocomplete="username"></label>' +
    '<label class="field" for="pass">Пароль<input id="pass" type="password" value="demo-pass" autocomplete="current-password"></label>' +
    '<div class="field">Войти как<div class="seg" role="group" aria-label="Роль"><button type="button" data-role="student" aria-pressed="' + (S.role === "student") + '">Студент</button><button type="button" data-role="admin" aria-pressed="' + (S.role === "admin") + '">Администратор</button></div></div>' +
    '<button class="btn" type="submit">Войти</button><p class="hint">Демо-вход: подойдут любые почта и пароль.</p></form></div>';
}
function vSearch() {
  return bar() + '<main class="wrap"><div class="col"><section class="hero"><h1 class="wordmark">Izde<i>.</i></h1><p class="lead">Спросите своими словами. Izde найдёт нужный пункт в документах университета.</p>' + searchBox() + '<div class="try"><span class="try-h">Попробуйте</span>' + chips() + '</div><p class="stat">Документов IITU в базе: ' + (Object.keys(DOCS).length + QUEUE.length) + ", готовы к поиску: " + Object.keys(DOCS).length + "</p></section></div></main>";
}
function vResults() {
  var res = search(S.q, S.mode), body = "";
  if (!res.length) {
    body = '<div class="empty"><h2>Ничего не нашлось</h2><p>' + (S.mode === "keyword"
      ? "В режиме «По словам» Izde ищет точные слова из запроса, а эти документы написаны на английском. Переключитесь на «По смыслу»."
      : "В прототипе проиндексировано три документа. Попробуйте один из примеров.") + "</p>" + chips() + "</div>";
  } else {
    var top = res[0].c;
    if (S.mode === "meaning") body += '<section class="answer" aria-label="Ответ"><span class="label">Ответ по документам</span><p>' + esc(top.answer) + '</p><button class="src" data-open="' + top.id + '">Источник: ' + esc(DOCS[top.doc].title) + ", " + esc(top.no) + " →</button></section>";
    body += '<p class="count">Найдено фрагментов: ' + res.length + '</p><div class="list">' + res.map(function (r) {
      var d = DOCS[r.c.doc];
      return '<button class="hit" data-open="' + r.c.id + '"><h3>' + esc(d.title) + '</h3><span class="meta">' + esc(d.code) + " · " + esc(r.c.sec) + " · " + esc(r.c.no) + '</span><span class="quote">' + hl(r.c.text, r.hits) + "</span></button>";
    }).join("") + "</div>";
  }
  return bar() + '<main class="wrap"><div class="col results">' + searchBox() + body + FOOT + "</div></main>";
}
function vDoc() {
  var d = DOCS[S.doc], cl = CLAUSES.filter(function (c) { return c.doc === S.doc; });
  return bar() + '<main class="wrap"><div class="col doc"><button class="back" data-go="back">← К результатам</button><div><h1>' + esc(d.title) + '</h1><p class="meta">' + esc(d.code) + " · " + esc(d.org) + " · язык: " + esc(d.lang) + ' · <a href="' + d.url + '" target="_blank" rel="noopener">открыть PDF на iitu.edu.kz</a></p></div>' +
    '<section class="card"><h2>Найденные пункты</h2>' + cl.map(function (c) {
      return '<div class="clause' + (c.id === S.clause ? " on" : "") + '"><span class="meta">' + esc(c.sec) + " · " + esc(c.no) + '</span><span class="quote">' + esc(c.text) + "</span></div>";
    }).join("") + '</section><section class="card"><h2>Оглавление</h2><ul class="toc">' + d.toc.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul></section>" +
    '<p class="foot">В прототипе карточка показывает оглавление и пункты, которые участвуют в поиске. Полный текст документа появится в рабочей версии.</p></div></main>';
}
function vAdmin() {
  var ready = Object.keys(DOCS).map(function (k) { return { title: DOCS[k].title, code: DOCS[k].code, lang: DOCS[k].lang, url: DOCS[k].url, ok: true }; });
  var all = ready.concat(QUEUE), n = all.length;
  return bar() + '<main class="wrap"><div class="col wide admin"><div class="admin-head"><div><h1>Документы</h1><p class="meta">Готово к поиску: ' + ready.length + " · в очереди: " + QUEUE.length + '</p></div><button class="btn" id="upload" type="button">Загрузить PDF или DOCX</button></div>' +
    '<p class="note" id="upnote" hidden>В прототипе загрузка отключена. В рабочей версии файл попадёт в очередь, будет разобран на фрагменты и появится в поиске.</p>' +
    '<section class="card usage"><span class="meta">Тариф Free: ' + n + " из " + PLAN_LIMIT + ' документов</span><div class="meter" role="img" aria-label="Занято ' + n + " из " + PLAN_LIMIT + '"><i style="width:' + (n / PLAN_LIMIT * 100) + '%"></i></div></section>' +
    '<div class="list"><div class="drow head"><span>Документ</span><span>Код</span><span>Язык</span><span>Статус</span></div>' + all.map(function (x) {
      return '<div class="drow"><span class="t"><a href="' + x.url + '" target="_blank" rel="noopener">' + esc(x.title) + '</a></span><span class="meta">' + esc(x.code) + '</span><span class="meta lang">' + esc(x.lang) + '</span><span class="pill ' + (x.ok ? "ok" : "wait") + '">' + (x.ok ? "Готов" : "В очереди") + "</span></div>";
    }).join("") + "</div>" +
    '<p class="foot">Все семь документов есть на iitu.edu.kz. Три прочитаны и участвуют в поиске, четыре найдены, но ещё не разобраны, поэтому стоят в очереди.</p></div></main>';
}

function render(focusSearch) {
  app.innerHTML = { login: vLogin, search: vSearch, results: vResults, doc: vDoc, admin: vAdmin }[S.view]();
  window.scrollTo(0, 0);
  if (focusSearch) { var q = document.getElementById("q"); if (q) q.focus(); }
  typePlaceholder();
}
// the home search field types out example questions while it is empty
var phTimer;
function typePlaceholder() {
  clearTimeout(phTimer);
  if (S.view !== "search" || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var i = 0, n = 0, dir = 1;
  (function tick() {
    var el = document.getElementById("q");
    if (!el || S.view !== "search") return;
    var t = EXAMPLES[i], wait = dir > 0 ? 55 : 22;
    n += dir;
    el.placeholder = t.slice(0, n) || " ";
    if (n === t.length) { dir = -1; wait = 1600; } else if (n === 0) { dir = 1; i = (i + 1) % EXAMPLES.length; wait = 350; }
    phTimer = setTimeout(tick, wait);
  })();
}
function run(q) { S.q = q.trim(); S.view = S.q ? "results" : "search"; render(); }

app.addEventListener("submit", function (e) {
  e.preventDefault();
  if (e.target.id === "login") { S.view = "search"; S.q = ""; render(true); }
  if (e.target.id === "sform") run(document.getElementById("q").value);
});
app.addEventListener("click", function (e) {
  var t = e.target.closest("button"); if (!t) return;
  var d = t.dataset;
  if (d.role) { S.role = d.role; var em = document.getElementById("email"); var v = em.value; render(); document.getElementById("email").value = d.role === "admin" && v === "student@iitu.edu.kz" ? "admin@iitu.edu.kz" : v; }
  else if (d.mode) { S.mode = d.mode; var q = document.getElementById("q"); S.q = q ? q.value.trim() : S.q; render(); }
  else if (d.ex) run(d.ex);
  else if (d.open) { var c = CLAUSES.filter(function (x) { return x.id === d.open; })[0]; S.doc = c.doc; S.clause = c.id; S.view = "doc"; render(); }
  else if (d.go === "search") { S.q = ""; S.view = "search"; render(true); }
  else if (d.go === "admin") { S.view = "admin"; render(); }
  else if (d.go === "back") { S.view = S.q ? "results" : "search"; render(); }
  else if (d.go === "logout") { S.view = "login"; S.role = "student"; render(); }
  else if (t.id === "upload") { document.getElementById("upnote").hidden = false; }
});
render();
</script>
